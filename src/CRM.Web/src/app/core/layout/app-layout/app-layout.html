<div class="flex h-svh overflow-hidden bg-white text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100">
  <a
    href="#main-content"
    class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-60 focus:rounded-md focus:bg-white focus:px-3 focus:py-2 focus:text-sm focus:shadow dark:focus:bg-zinc-900"
  >
    Skip to content
  </a>

  @if (layout.mobileOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-40 bg-zinc-950/40 lg:hidden"
      aria-label="Close navigation menu"
      (click)="layout.closeMobile()"
    ></button>
  }

  <app-sidebar />

  <div class="flex min-w-0 flex-1 flex-col">
    <app-topbar />

    <main
      id="main-content"
      class="min-h-0 flex-1 overflow-auto outline-none"
      tabindex="-1"
    >
      <router-outlet />
    </main>
  </div>
</div>
