@if (userResource.isLoading()){
    <p>Loading...</p>
} @else if (userResource.error()){
    <p>Error: {{ userResource.error()?.message }}</p>
} @else {
    <div class="card">
            <p-table [value]="userResource.value() ?? []" [tableStyle]="{ 'min-width': '50rem' }">
                <ng-template #header>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                    </tr>
                </ng-template>
                <ng-template #body let-user>
                    <tr>
                        <td>{{ user.firstName  }}</td>
                        <td>{{ user.email }}</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
}
